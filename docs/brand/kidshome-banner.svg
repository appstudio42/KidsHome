<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="KidsHome banner">
  <!-- Android TV / Fire TV banner (320×180) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="320" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E86A5B"/>
      <stop offset="0.55" stop-color="#E8B84A"/>
      <stop offset="1" stop-color="#5FA8A0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>

  <!-- Mark disk -->
  <circle cx="96" cy="90" r="52" fill="#5FA8A0"/>

  <!-- Cream house-face (matches launcher mark) -->
  <path fill="#FFF8F3" d="
    M96 52
    L128 78
    L128 112
    Q128 118 122 118
    L70 118
    Q64 118 64 112
    L64 78
    Z"/>
  <path fill="#E86A5B" fill-opacity="0.28" d="M96 52 L128 78 L64 78 Z"/>
  <circle cx="86" cy="88" r="5" fill="#5FA8A0"/>
  <circle cx="106" cy="88" r="5" fill="#5FA8A0"/>
  <path d="M82 100 C88 108 104 108 110 100"
        fill="none" stroke="#E86A5B" stroke-width="5" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="168" y="102"
        font-family="Nunito, Montserrat, Arial Rounded MT Bold, Arial, sans-serif"
        font-size="36" font-weight="700" fill="#FFF8F3">KidsHome</text>
</svg>
