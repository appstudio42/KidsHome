plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def ciDebugKeystore = rootProject.file("keystore/debug.keystore")

android {
    namespace 'io.github.marcelsavegnago.kidshome'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.marcelsavegnago.kidshome"
        minSdk 22
        targetSdk 34
        versionCode 130
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Keep the APK lean for 1 GB Fire tablets. Locales match README languages.
        resConfigs "en", "pt-rBR", "es", "fr", "de"
    }

    signingConfigs {
        // Stable test key checked into the repo — same signature across CI runs.
        // NOT for production. See keystore/README.md.
        ciDebug {
            storeFile ciDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else if (ciDebugKeystore.exists()) {
                signingConfig signingConfigs.ciDebug
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            if (ciDebugKeystore.exists()) {
                signingConfig signingConfigs.ciDebug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'GoogleAppIndexingWarning', 'MissingTranslation'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    testImplementation 'junit:junit:4.13.2'
}
