name: Capture README screenshots

# Generates real emulator screenshots (and optionally a setup GIF) for the README.
# Artifacts are uploaded; set commit_screenshots=true when running manually to push them.
on:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: 'Commit screenshots/GIF back to the branch'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # Monthly refresh — disable if unused
    - cron: '0 6 1 * *'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick pngquant gifsicle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew docs/capture-screenshots.sh

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Run emulator + capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_c
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell wm size 1280x800 || true
            adb root || true
            sleep 2
            adb install -r app/build/outputs/apk/release/app-release.apk
            bash docs/capture-screenshots.sh
            # Lightweight setup GIF: stitch key screens if a live recording is unavailable
            if [ ! -f docs/media/setup.gif ]; then
              mkdir -p docs/media
              ffmpeg -y -loop 1 -t 2 -i docs/screenshots/04-parent-kid-mode.png \
                     -loop 1 -t 2 -i docs/screenshots/07-allowed-apps.png \
                     -loop 1 -t 2 -i docs/screenshots/05-screen-time-settings.png \
                     -loop 1 -t 3 -i docs/screenshots/01-kid-home.png \
                     -filter_complex "[0][1][2][3]concat=n=4:v=1:a=0,fps=5,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
                     docs/media/setup.gif
            fi
            ls -lah docs/screenshots docs/media

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kidshome-readme-media
          path: |
            docs/screenshots/
            docs/media/setup.gif
            docs/logo.png
          if-no-files-found: error

      - name: Commit screenshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_screenshots == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots docs/media/setup.gif docs/logo.png || true
          if git diff --cached --quiet; then
            echo "No media changes to commit"
          else
            git commit -m "chore: refresh README screenshots from emulator"
            git push
          fi
