name: Android CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1 || true)"
          if [ -z "${SDKMANAGER}" ]; then
            echo "cmdline-tools sdkmanager not found; downloading..."
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            unzip -q /tmp/cmdtools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
            mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager at ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/tmp/sdk-licenses.log || true
          # Avoid the deprecated 'tools' package (removed from current repos).
          "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Prepare release signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SIGNING_KEYSTORE_BASE64:-}" ] || missing+=(SIGNING_KEYSTORE_BASE64)
          [ -n "${SIGNING_KEY_ALIAS:-}" ] || missing+=(SIGNING_KEY_ALIAS)
          [ -n "${SIGNING_KEY_STORE_PASSWORD:-}" ] || missing+=(SIGNING_KEY_STORE_PASSWORD)
          [ -n "${SIGNING_KEY_PASSWORD:-}" ] || missing+=(SIGNING_KEY_PASSWORD)

          # A tag release must be signed with the private key. Never fall back
          # to the committed debug.keystore on that path.
          if [ "${IS_TAG_RELEASE}" = "true" ] && [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Falha na release por tag: segredos de assinatura ausentes (${missing[*]}). Cadastre SIGNING_KEYSTORE_BASE64, SIGNING_KEY_ALIAS, SIGNING_KEY_STORE_PASSWORD e SIGNING_KEY_PASSWORD. Este job não assina o APK com keystore/debug.keystore."
            exit 1
          fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Release signing secrets found — configuring keystore"
            echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/release.keystore"
            if [ ! -s "${GITHUB_WORKSPACE}/release.keystore" ]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 decodificou para um keystore vazio. A release não usa keystore/debug.keystore."
              exit 1
            fi
            {
              echo "storeFile=release.keystore"
              echo "storePassword=${SIGNING_KEY_STORE_PASSWORD}"
              echo "keyAlias=${SIGNING_KEY_ALIAS}"
              echo "keyPassword=${SIGNING_KEY_PASSWORD}"
            } > "${GITHUB_WORKSPACE}/keystore.properties"
            echo "SIGNED=release" >> "$GITHUB_ENV"
            if [ "${IS_TAG_RELEASE}" = "true" ]; then
              # Refuse the debug keystore inside Gradle even if keystore.properties is missing.
              echo "GRADLE_SIGNING_ARGS=-PrequireReleaseSigning=true" >> "$GITHUB_ENV"
            else
              echo "GRADLE_SIGNING_ARGS=-PciSignRelease=true" >> "$GITHUB_ENV"
            fi
          else
            echo "No SIGNING_* secrets — PR/branch build signs with keystore/debug.keystore (-PciSignRelease=true). Tag releases fail before this path."
            if [ ! -f "${GITHUB_WORKSPACE}/keystore/debug.keystore" ]; then
              echo "Missing keystore/debug.keystore in the repository"
              exit 1
            fi
            echo "SIGNED=ci-debug" >> "$GITHUB_ENV"
            echo "GRADLE_SIGNING_ARGS=-PciSignRelease=true" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace ${GRADLE_SIGNING_ARGS}

      - name: Name release artifact
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*-unsigned.apk' | head -n1)
          if [ -z "${SRC}" ]; then
            SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          fi
          cp "${SRC}" "app/build/outputs/apk/release/KidsHome-release.apk"
          echo "Artifact from ${SRC} (signing=${SIGNED})"
          BUILD_TOOLS=$(ls -d "${ANDROID_SDK_ROOT}/build-tools/"* | sort -V | tail -n1)
          "${BUILD_TOOLS}/apksigner" verify --print-certs "app/build/outputs/apk/release/KidsHome-release.apk" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: KidsHome-release-apk
          path: app/build/outputs/apk/release/KidsHome-release.apk
          if-no-files-found: error

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/KidsHome-release.apk
          generate_release_notes: true
          body: |
            KidsHome release artifact, signed with the repository release key (`SIGNING_*` secrets). This job does not sign tag builds with `keystore/debug.keystore`.

            ## Install
            ```bash
            adb install -r KidsHome-release.apk
            ```

            See README for enabling the accessibility service.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
